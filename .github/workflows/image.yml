name: image

# Builds the image, checks it, and publishes it to GHCR.
#
#   push to main  -> ghcr.io/sleien/kodi-gbm:main and :sha-<short>
#   tag v1.2.3    -> ghcr.io/sleien/kodi-gbm:1.2.3 and :1.2
#
# The homelab pins the full version by digest; Renovate proposes bumps from the
# semver tags. `main` and `sha-` are for trying a build before tagging it.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck -s sh entrypoint.sh tests/image.sh

      - name: Add-on unit tests
        run: python3 -I -m unittest discover -s tests -v

      - uses: docker/setup-buildx-action@v3

      - name: Build for the checks
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: kodi-gbm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image
        run: tests/image.sh kodi-gbm:ci

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kodi-gbm
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          # The homelab host is x86-64.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
